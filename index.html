:root{--ink:#383a31;--sub:#726f60;--paper:#f7f0df;--jade:#426c61;--gold:#a7814a;--line:#cfc2a6}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#c8c2b3;font-family:'Gowun Batang',serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:460px;min-height:100dvh;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 70% 10%,#fff9e8 0,transparent 45%),linear-gradient(145deg,#f6edd9,#e9dec6);box-shadow:0 0 60px #0002}.shell:before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.6' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.15'/%3E%3C/svg%3E")}main{position:relative;z-index:1;min-height:100dvh;padding:28px 25px 36px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;min-height:40px}.small{font-size:12px;color:var(--sub);letter-spacing:2px}.back{border:1px solid var(--line);border-radius:50%;background:#f7f0dfb8;width:37px;height:37px;color:var(--ink);font-size:20px}.progress{display:flex;gap:5px}.progress span{width:22px;height:4px;background:#cfc4ad;border-radius:9px}.progress span.on{background:var(--jade)}.center{text-align:center}.spacer{flex:1}.eyebrow{font-size:12px;letter-spacing:4px;color:var(--jade);font-weight:bold}.title{font-family:'Noto Serif KR',serif;font-weight:600;font-size:clamp(34px,9vw,46px);line-height:1.35;letter-spacing:-2px;margin:14px 0}.subtitle{font-size:14px;line-height:2;color:var(--sub)}.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:22px 0}.button{width:100%;border:1px solid #31594f;background:var(--jade);color:#fffaf0;padding:16px 15px;border-radius:5px;font-size:15px;letter-spacing:2px;box-shadow:3px 4px 0 #2d5146;transition:transform .15s}.button:active{transform:translate(2px,2px);box-shadow:1px 2px 0 #2d5146}.button.secondary{background:transparent;color:var(--jade);box-shadow:none;border:1px solid var(--jade)}.button:disabled{opacity:.45;cursor:not-allowed}.footnote{font-size:11px;text-align:center;color:#857d6c;margin:15px 0}.scene{position:relative;height:310px;margin:30px -25px 10px;overflow:hidden}.scene svg{width:100%;height:100%}.scene:after{content:'';position:absolute;bottom:0;left:0;right:0;height:70px;background:linear-gradient(transparent,#eee3ce)}.seal{display:inline-flex;border:2px solid #9c654e;color:#9c654e;font-size:15px;align-items:center;justify-content:center;padding:8px;line-height:1.4;transform:rotate(-9deg)}.paper{background:#fbf6e9e8;border:1px solid #d8c8aa;padding:24px 22px;box-shadow:0 9px 28px #6a593020;position:relative}.paper:before,.paper:after{content:'❧';position:absolute;color:#b6a483;font-size:17px}.paper:before{top:8px;left:12px}.paper:after{bottom:8px;right:12px;transform:rotate(180deg)}.paper p{font-size:15px;line-height:2.15;margin:12px 0;word-break:keep-all}.chapter{font-size:12px;color:var(--jade);letter-spacing:3px}.portrait{height:160px;display:flex;align-items:center;justify-content:center;position:relative}.portrait .circle{border:1px solid #c5b693;width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#e6e5d4,#d5d8c5);font-size:68px;color:#657568}.portrait .circle svg{width:120px;height:120px}.name{color:var(--jade);font-size:13px;letter-spacing:3px}.dialogue{font-size:17px;line-height:2.1;min-height:130px}.choices{display:grid;gap:12px;margin-top:22px}.choice{border:1px solid #cbbd9e;background:#fff9edb8;padding:17px 15px;text-align:left;border-radius:4px;color:var(--ink)}.choice.active{border:2px solid var(--jade);background:#e6ece3;padding:16px 14px}.choice strong{display:block;font-size:17px;margin-bottom:7px}.choice small{font-size:12px;line-height:1.6;color:var(--sub)}.choice .mark{float:right;color:var(--jade)}.badge{display:inline-block;font-size:11px;border:1px solid #b7a88c;padding:5px 8px;color:#786c53;letter-spacing:1px}.location-art{height:190px;margin:16px 0;background:linear-gradient(#e7e4d3,#c6d3c1);border:7px solid #f9f3e5;outline:1px solid #c5b79b;display:grid;place-items:center;overflow:hidden}.location-art svg{width:100%;height:100%}.mission{background:#f9f4e8;border-left:3px solid var(--jade);padding:17px 18px;margin:20px 0;line-height:1.9;font-size:14px}.stamp{width:116px;height:116px;border:4px double #a35d4b;border-radius:50%;display:grid;place-items:center;color:#a35d4b;transform:rotate(-12deg);font-size:17px;line-height:1.5;margin:22px auto;background:#f9eddd}.stamp strong{font-size:22px}.stamps{display:flex;justify-content:center;gap:16px;margin:20px 0}.stamps .stamp{width:90px;height:90px;font-size:13px;margin:0}.stamps .stamp strong{font-size:16px}.note{width:100%;padding:14px;border:1px solid var(--line);background:#fffaf0;color:var(--ink);border-radius:4px;font-size:14px}.ornament{font-size:32px;color:var(--gold);letter-spacing:8px}.fade{animation:fade .45s ease both}@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.footer{margin-top:auto;padding-top:25px}.selected-count{color:var(--jade);font-size:13px;margin:15px 0}.bookcover{height:260px;margin:32px auto 25px;width:205px;border:9px double #9c815c;border-radius:3px;background:linear-gradient(145deg,#59776c,#304f47);box-shadow:9px 11px 0 #c9b899,13px 17px 24px #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f5e5bd}.bookcover .vertical{writing-mode:vertical-rl;letter-spacing:10px;font-size:29px;font-family:'Noto Serif KR',serif}.bookcover .line{width:65%;height:1px;background:#d8c399;margin:15px}.mini-link{border:0;background:none;color:var(--sub);text-decoration:underline;font-size:12px;padding:10px}.endtext{font-size:17px;line-height:2.4;text-align:center}.endtext em{color:var(--jade);font-style:normal;font-weight:bold}@media(min-width:500px){.shell{margin:28px auto;min-height:820px;border-radius:8px}main{min-height:820px}}@media(max-height:720px){.scene{height:230px;margin-top:12px}.bookcover{height:210px;margin:15px auto}}
.guide-point{background:#f2e9d5;border-left:3px solid var(--gold);padding:12px 14px;margin-top:15px}.guide-point strong{font-size:13px;color:var(--jade)}.guide-point p{font-size:13px;line-height:1.9;margin:6px 0 0}
/* 3.5단계: 기존 유람첩 안에 실제 지도 통합 */
.tour-map-wrap{position:relative;margin:18px -10px 8px;border:1px solid #c8b99c;border-radius:9px;overflow:hidden;background:#e6e9dc}
.tour-map{width:100%;height:340px;z-index:0}
.tour-map-key{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 8px}
.tour-map-key span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink)}
.tour-map-key b{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;color:#fff;font:700 11px sans-serif}
.tour-map-note{font-size:11px;line-height:1.65;color:var(--sub);margin:7px 0 12px}
.tour-map-pin{width:35px;height:35px;border-radius:50% 50% 50% 7px;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 7px #0005;display:grid;place-items:center;color:#fff;font:700 14px sans-serif}
.tour-map-pin span{transform:rotate(45deg)}
.map-fallback{display:none;padding:24px 15px;text-align:center;line-height:1.8;color:var(--sub);font-size:13px}
.map-fallback.visible{display:block}
.tour-map-wrap .leaflet-container{font-family:'Gowun Batang',serif}
.tour-map-wrap .leaflet-control-attribution{font-size:9px}
@media(max-width:380px){.tour-map{height:280px}.tour-map-key{gap:6px}}

/* v1.4: 지도 원래 범위 복귀 버튼 */
.tour-map-reset{position:absolute;right:12px;bottom:28px;z-index:500;border:1px solid #b8ab91;border-radius:7px;background:#fffaf0;color:#365e52;padding:10px 12px;font-family:inherit;font-size:12px;font-weight:700;box-shadow:0 2px 9px #0002;cursor:pointer}
.tour-map-reset:focus-visible{outline:3px solid #ad8746;outline-offset:2px}

.museum-task{margin:16px 0}.museum-photo{display:block;width:100%;max-height:235px;object-fit:contain;background:#e8dfcc;border:5px solid #f9f3e5;outline:1px solid #c5b79b;margin:14px 0}.mission-input{width:100%;padding:13px 12px;border:1px solid #b9ab8d;background:#fffdf6;border-radius:4px;margin:6px 0 11px;font-size:16px}.mission-feedback{padding:12px 13px;border-left:3px solid #a7814a;background:#f2e9d5;margin:12px 0;font-size:14px;line-height:1.8}.mission-feedback.ok{border-left-color:#426c61;background:#e6ece3}.hint-toggle{border:0;background:transparent;text-decoration:underline;color:#426c61;padding:10px 0;font-size:14px}.mission-step{font-size:12px;letter-spacing:2px;color:#426c61;text-align:center}

.ceramic-photo{display:block;width:100%;max-width:310px;margin:12px auto;border:5px solid #f6ecd7;object-fit:cover}.ceramic-puzzle{display:grid;grid-template-columns:repeat(3,1fr);gap:0;width:min(100%,315px);aspect-ratio:1;margin:16px auto;background:#c3b294;padding:4px}.ceramic-tile{border:1px solid #c3b294;border-radius:0;padding:0;background-repeat:no-repeat;background-size:300% 300%;aspect-ratio:1;box-shadow:none}.ceramic-tile.chosen{outline:3px solid #b45543;outline-offset:-3px;filter:brightness(1.08)}.ceramic-tile:focus-visible{outline:3px solid #426c61;outline-offset:2px}.ceramic-actions{display:grid;gap:9px}.ceramic-info{font-size:13px;line-height:1.9;color:var(--sub)}.ceramic-upload{width:100%;max-width:100%;font-size:12px;margin:12px 0}.ceramic-preview{max-width:100%;max-height:250px;display:block;margin:8px auto;border:4px solid #f6ecd7}
.silleuksa-art{width:100%;max-width:300px;margin:16px auto;background:#f3eddf;border:1px solid #d8c8aa;border-radius:9px;overflow:hidden}.silleuksa-art svg{display:block;width:100%;height:auto}.silleuksa-options{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 15px}.silleuksa-option{flex:1;min-width:75px;background:#faf5e8;border:1px solid #bdae93;border-radius:6px;padding:10px 4px;font-size:13px;color:#383a31}.silleuksa-option.active{border:2px solid #426c61;background:#e5eee7;font-weight:bold}
.wish-tree{height:420px;max-width:350px;margin:15px auto 19px;background-size:cover;background-position:center center;position:relative;border:7px solid #f7f0df;outline:1px solid #c5b79b;border-radius:8px;overflow:hidden}.wish-tree-note{position:absolute;top:31%;left:57%;width:56px;height:75px;background:#f9e49a;border:1px solid #d4b96d;box-shadow:2px 5px 7px #4e473544;transform:rotate(8deg);display:flex;align-items:center;justify-content:center;font-size:13px;color:#69542d;transition:opacity .2s}.wish-tree-note:before{content:'';position:absolute;bottom:100%;left:50%;height:25px;border-left:1px solid #a48a59}.wish-tree-note.empty{opacity:0}.wish-tree-open{position:absolute;top:27%;left:46%;width:110px;height:125px;border:0;background:transparent;color:transparent;cursor:pointer}.wish-tree-open:focus-visible{outline:3px solid #426c61}.wish-write-panel{margin:12px 0;display:grid;gap:12px}.wish-write-panel[hidden]{display:none}.wish-write-panel .note{resize:vertical}.wish-read-overlay{position:fixed;inset:0;z-index:2000;background:#292e28aa;display:flex;align-items:center;justify-content:center;padding:22px}.wish-read-paper{width:min(340px,100%);background:#fff2c5;border:1px solid #b99b56;padding:25px;box-shadow:0 12px 30px #0004;text-align:center;word-break:break-word;white-space:pre-wrap;line-height:1.9}.wish-read-paper p{margin:15px 0 22px}.wish-read-paper button{width:100%}</style></head><body><div class="shell"><main id="app" aria-live="polite"><div style="margin:auto;text-align:center;padding:60px 12px"><p style="letter-spacing:4px;color:#426c61">여주의 시간을 걷다</p><h1 style="font-size:38px;line-height:1.5">아씨의<br>여주 유람</h1><p>오래된 기록의 끝에서<br>오늘, 당신의 이야기가 시작됩니다.</p><p>화면을 불러오는 중입니다.</p></div></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const PLACES=[{id:'silleuksa',name:'신륵사',tag:'남한강 곁에 머문 시간',desc:'강가에 자리한 사찰에서 오래된 풍경을 만납니다.',hint:'강과 사찰이 만나는 풍경을 바라보며 오늘 가장 마음에 남은 것을 떠올려 보세요.',line:'물길을 따라 흐른 세월은, 누구의 기억도 같은 모습으로 남겨 두지 않는구나.',symbol:'山'},{id:'ceramic',name:'여주도자세상',tag:'흙이 품은 이야기',desc:'여주의 도자 문화를 만나고 나만의 감상을 남깁니다.',hint:'도자기의 모양이나 무늬를 살펴보고 마음에 남는 하나를 골라 보세요.',line:'같은 흙에서 태어나도 저마다 다른 빛을 품는구나.',symbol:'土'},{id:'museum',name:'여주박물관',tag:'기록 너머의 이야기',desc:'여주에 남겨진 기록과 유물을 통해 시간을 돌아봅니다.',hint:'전시에서 가장 기억에 남는 물건이나 이야기를 하나 찾아보세요.',line:'기록되지 않은 마음도 분명 이곳에 머물렀겠지.',symbol:'文'}];
const STORIES={
 museum:{title:'남겨진 이름, 이어지는 기록',pages:[['오래된 유람첩','사람들은 자신의 이름을 남기고 싶어 하지. 허나 나는 이곳에서 만난 이들의 이름을 먼저 적어 두려 한다.'],['여종','아씨, 이곳에는 오래도록 전해 내려온 이름과 이야기가 가득하답니다. 그런데 이 글을 남기신 분은 정작 자신의 이름은 적지 않으셨지요.'],['여종','아씨께서는 오늘 어떤 이름과 이야기를 기억하고 싶으십니까? 어쩐지 이 길을 아시는 듯한 눈빛이십니다.']]},
 ceramic:{title:'손끝에 남은 모양',pages:[['오래된 유람첩','흙은 같은 빛을 띠어도, 빚는 손에 따라 다른 모습이 된다. 나는 마음에 남은 그릇 하나를 그리다 붓을 멈추었다.'],['여종','아씨, 이 페이지에는 끝내 완성하지 못한 도자 그림이 있답니다. 무엇이 그토록 마음에 남았던 걸까요?'],['여종','옛사람의 답을 찾으실 필요는 없습니다. 오늘 아씨의 마음이 머무는 작품을 골라 보시지요.']]},
 silleuksa:{title:'흘러가는 마음, 남겨 두는 소원',pages:[['오래된 유람첩','강물은 어제도 오늘도 흐른다. 다시 이 길을 걷는다면, 그때에도 같은 소원을 품고 있을까.'],['여종','아씨, 이곳의 기록에는 소원을 빌었다는 흔적만 남아 있답니다. 무슨 소원이었는지는 끝내 적혀 있지 않지요.'],['여종','그러니 아씨의 소원은 아씨의 것으로 남겨 두셔요. 혹여 낯익은 마음이 들더라도, 오늘의 바람은 오늘 새롭게 태어나는 것이니까요.']]}
};
const GUIDES={
 museum:{pages:[
  {title:'여주의 역사를 담은 두 건물',label:'여주박물관 · 공간 안내',body:'여주박물관은 여주의 역사와 문화를 전시하는 공간입니다. 여마관과 황마관 두 건물로 이루어져 있으며, 지역의 유물과 기록을 통해 여주를 알아볼 수 있습니다.',point:'여마관의 여주역사실과 황마관의 여러 전시실을 살펴보세요.'},
  {title:'왕릉과 문학, 남한강',label:'여주박물관 · 전시 안내',body:'황마관에서는 조선왕릉과 관련된 전시, 여주 출신 소설가 류주현의 문학 세계, 남한강의 수석 등을 만나볼 수 있습니다. 여주의 역사에는 왕실뿐 아니라 지역 사람들과 강의 이야기도 함께 담겨 있습니다.',point:'관심 있는 전시를 골라 오래 바라보세요. 어떤 이름이 가장 기억에 남나요?'},
  {title:'유물에서 사람의 흔적을 찾기',label:'여주박물관 · 관람 포인트',body:'여마관의 여주역사실에서는 여주의 여러 시대를 보여 주는 유물과 문화유산을 살펴볼 수 있습니다. 전시를 볼 때는 유물의 이름뿐 아니라 누가 사용했고 어떤 시대를 살았는지도 생각해 보세요.',point:'전시실 위치와 내용은 변경될 수 있으니 현장 안내를 먼저 확인해 주세요.'}
 ]},
 ceramic:{pages:[
  {title:'흙이 생활의 예술이 되는 곳',label:'여주도자세상 · 공간 안내',body:'여주도자세상은 도자기를 감상하고 일상 속 공예를 만날 수 있는 복합문화공간입니다. 경기생활도자미술관을 중심으로 전시와 도자 관련 공간이 마련되어 있습니다.',point:'도자기를 볼 때 모양과 빛깔, 표면의 질감을 찬찬히 살펴보세요.'},
  {title:'경기생활도자미술관',label:'여주도자세상 · 전시 안내',body:'경기생활도자미술관에서는 생활과 예술을 잇는 도자 작품을 만날 수 있습니다. 도자기는 그릇으로 쓰이기도 하고, 작가의 생각을 표현하는 작품이 되기도 합니다.',point:'전시 주제와 작품은 시기에 따라 달라집니다. 방문 당일 전시 안내를 확인해 주세요.'},
  {title:'내 마음이 머무는 도자기',label:'여주도자세상 · 관람 포인트',body:'여주도자세상에는 갤러리샵, 아트샵, 리빙샵 등 다양한 도자·공예 상품을 살펴볼 수 있는 공간도 있습니다. 같은 용도의 그릇이라도 빚은 사람에 따라 모양과 분위기가 다릅니다.',point:'가장 마음에 드는 도자기 하나를 골라 보세요. 왜 그 작품에 눈길이 머물렀나요?'}
 ]},
 silleuksa:{pages:[
  {title:'남한강 곁의 오래된 사찰',label:'신륵사 · 공간 안내',body:'신륵사는 남한강변에 자리한 사찰입니다. 강과 가까운 풍경이 특징이며, 오랜 세월 동안 불교 문화와 지역의 역사를 간직해 왔습니다.',point:'사찰을 둘러보며 강물과 건축물이 함께 만드는 풍경을 느껴 보세요.'},
  {title:'다층전탑과 다층석탑',label:'신륵사 · 문화유산 안내',body:'신륵사에는 벽돌을 쌓아 만든 다층전탑과 돌로 만든 다층석탑이 있습니다. 두 탑의 재료와 형태를 비교하면 옛 건축 기술의 차이를 관찰할 수 있습니다.',point:'다층전탑의 층마다 지붕 모양을 자세히 살펴보세요. 문화유산에는 손대지 않도록 해요.'},
  {title:'강월헌과 남겨진 시간',label:'신륵사 · 관람 포인트',body:'신륵사에는 승려들의 흔적을 전하는 조사당과 남한강을 바라보는 강월헌 등 여러 볼거리가 있습니다. 특히 강변 풍경은 오랜 시간과 오늘의 마음을 함께 떠올리게 합니다.',point:'조용히 주변을 둘러보고 오늘의 소원을 마음속에 떠올려 보세요. 예불과 참배 중인 분들을 배려해 주세요.'}
 ]}

// 지도 원본의 Leaflet 좌표를 그대로 사용합니다. 지도 오류가 나도 기존 버튼은 작동합니다.
function initTourMap(){
 const el=document.getElementById('tour-map');if(!el)return;
 const fallback=()=>{el.style.display='none';const msg=document.getElementById('tour-map-fallback');if(msg)msg.classList.add('visible')};
 if(typeof L==='undefined'){fallback();return}
 try{
  tourMapInstance=L.map(el,{scrollWheelZoom:false,zoomControl:true,attributionControl:true});
  const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'});
  tiles.addTo(tourMapInstance);
  const spots=[
   {id:'museum',n:1,name:'여주박물관',lat:37.2996196,lon:127.6533694,color:'#557d70'},
   {id:'ceramic',n:2,name:'여주도자세상',lat:37.30016494157502,lon:127.6553947278396,color:'#ad8746'},
   {id:'silleuksa',n:3,name:'신륵사',lat:37.2974985,lon:127.6615769,color:'#bd7059'}
  ];
  for(const s of spots){
   const icon=L.divIcon({className:'',html:`<div class="tour-map-pin" style="background:${s.color}"><span>${s.n}</span></div>`,iconSize:[35,40],iconAnchor:[17,36]});
   L.marker([s.lat,s.lon],{icon,title:s.name,keyboard:true}).addTo(tourMapInstance).on('click',()=>openPlace(s.id));
  }
  tourMapInitialBounds=L.latLngBounds(spots.map(s=>[s.lat,s.lon])).pad(.35);
  tourMapInstance.fitBounds(tourMapInitialBounds,{maxZoom:16});
  requestAnimationFrame(()=>{if(tourMapInstance)tourMapInstance.invalidateSize()});
 }catch(err){console.warn('지도 표시 실패:',err);if(tourMapInstance){tourMapInstance.remove();tourMapInstance=null}fallback()}
}
function resetTourMapView(){if(tourMapInstance&&tourMapInitialBounds){tourMapInstance.fitBounds(tourMapInitialBounds,{maxZoom:16,animate:true})}}
function openPlace(id){if(!PLACES.some(p=>p.id===id))return;state.selected=[...new Set([...state.selected,id])];go('story',{active:id,storyPage:0})};function advanceStory(){const story=STORIES[state.active];if(!story)return go('journey');if(state.storyPage<story.pages.length-1){state.storyPage++;save();render()}else go('guide',{guidePage:0})};function previousStory(){state.storyPage=Math.max(0,(state.storyPage||0)-1);save();render()};function advanceGuide(){const guide=GUIDES[state.active];if(!guide)return go('journey');if((state.guidePage||0)<guide.pages.length-1){state.guidePage++;save();render()}else go('place',{museumMissionStep:0,silleuksaMissionStep:0})};function previousGuide(){state.guidePage=Math.max(0,(state.guidePage||0)-1);save();render()};function finishTour(){if(!state.done.length)return alert('한 곳 이상 유람한 뒤 마지막 페이지를 펼칠 수 있습니다.');go('ending')};function advanceIntro(){if(state.dialogue<3){state.dialogue++;save();render()}else go('select')};function togglePlace(id){if(state.done.length)return alert('진행 중인 유람은 장소를 변경할 수 없습니다.');state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];save();render()};function toggleMuseumHint(){const h=document.getElementById('museumHint'),b=document.getElementById('museumHintButton');if(!h||!b)return;const show=h.style.display==='none';h.style.display=show?'block':'none';b.textContent=show?'힌트 접기 ▴':'힌트 보기 ▾';b.setAttribute('aria-expanded',String(show))};
function checkMuseumAnswer(){const step=Number(state.museumMissionStep)||0;const a=(document.getElementById('museumAnswerA')?.value||'').replace(/\s+/g,'').toLowerCase();const b=(document.getElementById('museumAnswerB')?.value||'').replace(/\s+/g,'').toLowerCase();const ok=step===0?a==='선원계보기략':step===1?(a==='이숙진'||a==='이숙진여사')&&(b==='조성환'||b==='조성환선생'):a.replace(/,/g,'')==='3905';const fb=document.getElementById('museumFeedback');if(!ok){if(fb)fb.innerHTML='<div class="mission-feedback">아직 정답이 아니에요. 전시를 다시 살펴보거나 힌트를 확인해 주세요.</div>';return;}if(step<2){state.museumMissionStep=step+1;save();render();window.scrollTo(0,0)}else{state.museumMissionStep=0;completeMission()}};
function previousMuseumMission(){state.museumMissionStep=Math.max(0,(Number(state.museumMissionStep)||0)-1);save();render()};

function chooseCeramicTile(i){if(state.active!=='ceramic'||state.ceramicMissionStep!==0)return;if(ceramicChosen<0){ceramicChosen=i;render();return}if(ceramicChosen===i){ceramicChosen=-1;render();return}const a=ceramicChosen;[state.ceramicPuzzle[a],state.ceramicPuzzle[i]]=[state.ceramicPuzzle[i],state.ceramicPuzzle[a]];ceramicChosen=-1;save();render()}
function restartCeramicPuzzle(){state.ceramicPuzzle=[4,0,8,2,6,1,7,3,5];ceramicChosen=-1;save();render()}
function nextCeramicMission(){if(state.active!=='ceramic')return;if(state.ceramicMissionStep===0&&!state.ceramicPuzzle.every((v,i)=>v===i))return;state.ceramicMissionStep=Math.min(2,state.ceramicMissionStep+1);ceramicChosen=-1;go('place')}
function previousCeramicMission(){state.ceramicMissionStep=Math.max(0,state.ceramicMissionStep-1);ceramicChosen=-1;ceramicPhotoPreview=null;go('place')}
function previewCeramicFoundPhoto(input){const file=input.files&&input.files[0];if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{const slot=document.getElementById('ceramicFoundPhotoSlot');if(slot){slot.innerHTML='<img class="ceramic-preview" alt="현장에서 촬영한 도자 인형 미리보기">';slot.querySelector('img').src=reader.result}};reader.readAsDataURL(file)}
function previewCeramicPhoto(input){const file=input.files&&input.files[0];if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{ceramicPhotoPreview=reader.result;const slot=document.getElementById('ceramicPhotoSlot');if(slot)slot.innerHTML='<img class="ceramic-preview" alt="선택한 도자 작품 미리보기">',slot.querySelector('img').src=ceramicPhotoPreview};reader.readAsDataURL(file)}
function finishCeramicMission(){state.ceramicReflection=(document.getElementById('ceramicReflection')?.value||'').trim();ceramicPhotoPreview=null;completeMission()}

function checkSilleuksaAnswer(){const value=(document.getElementById('silleuksaAnswer')?.value||'').replace(/\s/g,'');const msg=document.getElementById('silleuksaAnswerMessage');if(!msg)return;if(/^2[,，/·-]?1$/.test(value)){msg.textContent='✓ 정답이에요! 다음 미션으로 이동합니다.';state.silleuksaMissionStep=1;go('place')}else{msg.textContent='아직 정답이 아니에요. 안내문을 다시 살펴보고 도전해 보세요.'}}
function toggleSilleuksaHint(){const el=document.getElementById('silleuksaHint');if(el)el.style.display=el.style.display==='none'?'block':'none'}
function chooseSilleuksaColor(type,index){if(state.active!=='silleuksa')return;if(type==='halo')state.silleuksaHalo=index;else if(type==='lotus')state.silleuksaLotus=index;save();render()}
function nextSilleuksaMission(){state.silleuksaMissionStep=2;go('place')}
function previousSilleuksaMission(){state.silleuksaMissionStep=Math.max(0,state.silleuksaMissionStep-1);go('place')}
function attachSilleuksaWish(){const input=document.getElementById('silleuksaWish');if(!input)return;const wish=input.value.trim();if(!wish){alert('나무에 달 소원을 먼저 적어 주세요.');return}state.silleuksaWish=wish.slice(0,100);save();render()}
function editSilleuksaWish(){const panel=document.getElementById('wishWritePanel');if(panel){panel.hidden=false;document.getElementById('silleuksaWish')?.focus()}}
function readSilleuksaWish(){if(!state.silleuksaWish)return;const overlay=document.createElement('div');overlay.className='wish-read-overlay';overlay.id='wishReadOverlay';const paper=document.createElement('div');paper.className='wish-read-paper';paper.setAttribute('role','dialog');paper.setAttribute('aria-modal','true');paper.setAttribute('aria-label','나의 소원');const heading=document.createElement('strong');heading.textContent='나의 소원 쪽지';const body=document.createElement('p');body.textContent=state.silleuksaWish;const close=document.createElement('button');close.className='button';close.textContent='소원나무로 돌아가기';close.onclick=()=>overlay.remove();paper.append(heading,body,close);overlay.append(paper);overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});document.body.append(overlay);close.focus()}
function finishSilleuksaMission(){const input=document.getElementById('silleuksaWish');if(input&&input.value.trim()&&!state.silleuksaWish){state.silleuksaWish=input.value.trim().slice(0,100);save()}completeMission()}
function completeMission(){if(!state.done.includes(state.active))state.done.push(state.active);if(!state.selected.includes(state.active))state.selected.push(state.active);go('memory')};function saveNote(){state.notes[state.active]=document.getElementById('note').value.trim();go('journey')};function resetTour(){if(!confirm('유람을 처음부터 다시 시작할까요? 기존 기록이 초기화됩니다.'))return;state={screen:'home',dialogue:0,storyPage:0,guidePage:0,museumMissionStep:0,ceramicMissionStep:0,ceramicPuzzle:null,ceramicReflection:'',silleuksaMissionStep:0,silleuksaWish:'',silleuksaHalo:0,silleuksaLotus:0,selected:[],done:[],notes:{},active:null};save();render()};try{render()}catch(error){console.error(error);app.innerHTML=`<div style="margin:auto;text-align:center;padding:40px"><h1>아씨의 여주 유람</h1><p>화면을 불러오는 중 오류가 발생했습니다.</p><button onclick="localStorage.removeItem('yeoju-tour-v1');location.reload()" style="padding:14px;background:#426c61;color:white;border:0">처음부터 다시 시작</button></div>`}
</script></body></html>
