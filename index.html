)}.choice .mark{float:right;color:var(--jade)}.badge{display:inline-block;font-size:11px;border:1px solid #b7a88c;padding:5px 8px;color:#786c53;letter-spacing:1px}.location-art{height:190px;margin:16px 0;background:linear-gradient(#e7e4d3,#c6d3c1);border:7px solid #f9f3e5;outline:1px solid #c5b79b;display:grid;place-items:center;overflow:hidden}.location-art svg{width:100%;height:100%}.mission{background:#f9f4e8;border-left:3px solid var(--jade);padding:17px 18px;margin:20px 0;line-height:1.9;font-size:14px}.stamp{width:116px;height:116px;border:4px double #a35d4b;border-radius:50%;display:grid;place-items:center;color:#a35d4b;transform:rotate(-12deg);font-size:17px;line-height:1.5;margin:22px auto;background:#f9eddd}.stamp strong{font-size:22px}.stamps{display:flex;justify-content:center;gap:16px;margin:20px 0}.stamps .stamp{width:90px;height:90px;font-size:13px;margin:0}.stamps .stamp strong{font-size:16px}.note{width:100%;padding:14px;border:1px solid var(--line);background:#fffaf0;color:var(--ink);border-radius:4px;font-size:14px}.ornament{font-size:32px;color:var(--gold);letter-spacing:8px}.fade{animation:fade .45s ease both}@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.footer{margin-top:auto;padding-top:25px}.selected-count{color:var(--jade);font-size:13px;margin:15px 0}.bookcover{height:260px;margin:32px auto 25px;width:205px;border:9px double #9c815c;border-radius:3px;background:linear-gradient(145deg,#59776c,#304f47);box-shadow:9px 11px 0 #c9b899,13px 17px 24px #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f5e5bd}.bookcover .vertical{writing-mode:vertical-rl;letter-spacing:10px;font-size:29px;font-family:'Noto Serif KR',serif}.bookcover .line{width:65%;height:1px;background:#d8c399;margin:15px}.mini-link{border:0;background:none;color:var(--sub);text-decoration:underline;font-size:12px;padding:10px}.endtext{font-size:17px;line-height:2.4;text-align:center}.endtext em{color:var(--jade);font-style:normal;font-weight:bold}@media(min-width:500px){.shell{margin:28px auto;min-height:820px;border-radius:8px}main{min-height:820px}}@media(max-height:720px){.scene{height:230px;margin-top:12px}.bookcover{height:210px;margin:15px auto}}

/* 3.5단계: 기존 유람첩 안에 실제 지도 통합 */
.tour-map-wrap{position:relative;margin:18px -10px 8px;border:1px solid #c8b99c;border-radius:9px;overflow:hidden;background:#e6e9dc}
.tour-map{width:100%;height:340px;z-index:0}
.tour-map-key{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 8px}
.tour-map-key span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink)}
.tour-map-key b{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;color:#fff;font:700 11px sans-serif}
.tour-map-note{font-size:11px;line-height:1.65;color:var(--sub);margin:7px 0 12px}
.tour-map-pin{width:35px;height:35px;border-radius:50% 50% 50% 7px;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 7px #0005;display:grid;place-items:center;color:#fff;font:700 14px sans-serif}
.tour-map-pin span{transform:rotate(45deg)}
.map-fallback{display:none;padding:24px 15px;text-align:center;line-height:1.8;color:var(--sub);font-size:13px}
.map-fallback.visible{display:block}
.tour-map-wrap .leaflet-container{font-family:'Gowun Batang',serif}
.tour-map-wrap .leaflet-control-attribution{font-size:9px}
@media(max-width:380px){.tour-map{height:280px}.tour-map-key{gap:6px}}

/* v1.4: 지도 원래 범위 복귀 버튼 */
.tour-map-reset{position:absolute;right:12px;bottom:28px;z-index:500;border:1px solid #b8ab91;border-radius:7px;background:#fffaf0;color:#365e52;padding:10px 12px;font-family:inherit;font-size:12px;font-weight:700;box-shadow:0 2px 9px #0002;cursor:pointer}
.tour-map-reset:focus-visible{outline:3px solid #ad8746;outline-offset:2px}

.museum-task{margin:16px 0}.museum-photo{display:block;width:100%;max-height:235px;object-fit:contain;background:#e8dfcc;border:5px solid #f9f3e5;outline:1px solid #c5b79b;margin:14px 0}.mission-input{width:100%;padding:13px 12px;border:1px solid #b9ab8d;background:#fffdf6;border-radius:4px;margin:6px 0 11px;font-size:16px}.mission-feedback{padding:12px 13px;border-left:3px solid #a7814a;background:#f2e9d5;margin:12px 0;font-size:14px;line-height:1.8}.mission-feedback.ok{border-left-color:#426c61;background:#e6ece3}.hint-toggle{border:0;background:transparent;text-decoration:underline;color:#426c61;padding:10px 0;font-size:14px}.mission-step{font-size:12px;letter-spacing:2px;color:#426c61;text-align:center}
</style></head><body><div class="shell"><main id="app" aria-live="polite"><div style="margin:auto;text-align:center;padding:60px 12px"><p style="letter-spacing:4px;color:#426c61">여주의 시간을 걷다</p><h1 style="font-size:38px;line-height:1.5">아씨의<br>여주 유람</h1><p>오래된 기록의 끝에서<br>오늘, 당신의 이야기가 시작됩니다.</p><p>화면을 불러오는 중입니다.</p></div></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>

const STORIES={
 museum:{title:'남겨진 이름, 이어지는 기록',pages:[['오래된 유람첩','사람들은 자신의 이름을 남기고 싶어 하지. 허나 나는 이곳에서 만난 이들의 이름을 먼저 적어 두려 한다.'],['여종','아씨, 이곳에는 오래도록 전해 내려온 이름과 이야기가 가득하답니다. 그런데 이 글을 남기신 분은 정작 자신의 이름은 적지 않으셨지요.'],['여종','아씨께서는 오늘 어떤 이름과 이야기를 기억하고 싶으십니까? 어쩐지 이 길을 아시는 듯한 눈빛이십니다.']]},
 ceramic:{title:'손끝에 남은 모양',pages:[['오래된 유람첩','흙은 같은 빛을 띠어도, 빚는 손에 따라 다른 모습이 된다. 나는 마음에 남은 그릇 하나를 그리다 붓을 멈추었다.'],['여종','아씨, 이 페이지에는 끝내 완성하지 못한 도자 그림이 있답니다. 무엇이 그토록 마음에 남았던 걸까요?'],['여종','옛사람의 답을 찾으실 필요는 없습니다. 오늘 아씨의 마음이 머무는 작품을 골라 보시지요.']]},
 silleuksa:{title:'흘러가는 마음, 남겨 두는 소원',pages:[['오래된 유람첩','강물은 어제도 오늘도 흐른다. 다시 이 길을 걷는다면, 그때에도 같은 소원을 품고 있을까.'],['여종','아씨, 이곳의 기록에는 소원을 빌었다는 흔적만 남아 있답니다. 무슨 소원이었는지는 끝내 적혀 있지 않지요.'],['여종','그러니 아씨의 소원은 아씨의 것으로 남겨 두셔요. 혹여 낯익은 마음이 들더라도, 오늘의 바람은 오늘 새롭게 태어나는 것이니까요.']]}
};

function render(){if(tourMapInstance){tourMapInstance.remove();tourMapInstance=null;}const p=PLACES.find(x=>x.id===state.active);let html='';if(state.screen==='home')html=`${navHeader()}<div class="spacer"></div><div class="center fade"><div class="eyebrow">여주의 시간을 걷다</div><div class="scene">${landscape}</div><div class="ornament">❦</div><h1 class="title">아씨의<br>여주 유람</h1><p class="subtitle">오래된 기록의 끝에서<br>오늘, 당신의 이야기가 시작됩니다.</p></div><div class="spacer"></div><div class="footer">${btn('유람 시작하기',"go('intro',{dialogue:0})")}<p class="footnote">여주에서 펼쳐지는 나만의 유람첩</p></div>`;
if(state.screen==='intro'){let lines=[['여종','아씨, 먼 길 오시느라 고생 많으셨습니다.'],['여종','이 유람첩에는 오래전 여주를 거닐었던 한 여인의 발자취가 남아 있답니다.'],['여종','허나 이상하지요. 어디를 다녀왔는지는 적혀 있는데, 그곳에서 무엇을 느꼈는지는 비어 있으니 말입니다.'],['여종','이제 마음이 가는 곳부터 자유롭게 둘러보시지요. 언제든 아씨의 유람을 마칠 수 있답니다.']];let d=lines[Math.min(state.dialogue,lines.length-1)];html=`${navHeader('home',1)}<div class="spacer"></div><div class="center"><div class="chapter">첫 번째 장 · 초대</div><div class="portrait"><div class="circle">${person}</div></div><div class="name">유람첩의 안내자 · 여종</div></div><div class="paper fade" key="${state.dialogue}"><p class="dialogue">“${d[1]}”</p><div class="small" style="text-align:right">${state.dialogue+1} / ${lines.length}</div></div><div class="spacer"></div><div class="footer">${btn(state.dialogue===3?'유람첩 펼치기':'다음 이야기', 'advanceIntro()')}</div>`}

if(state.screen==='journey'){const completed=PLACES.filter(x=>state.done.includes(x.id));html=`${navHeader('select',3)}<div class="center" style="padding:28px 0 8px"><div class="chapter">세 번째 장 · 발자취를 남기다</div><h2 class="title" style="font-size:30px">아씨의 유람길</h2><p class="subtitle">마음이 가는 곳을 언제든 방문해 보세요.</p></div><div class="paper" style="margin-top:20px"><div class="center"><div class="small">기억 도장 · ${completed.length} / ${PLACES.length}</div><div class="stamps">${PLACES.map(x=>`<div class="stamp" style="${state.done.includes(x.id)?'':'opacity:.25;filter:grayscale(1)'}"><div><strong>${x.symbol}</strong><br>${x.name}</div></div>`).join('')}</div></div></div><div class="choices">${PLACES.map(x=>`<button class="choice" onclick="openPlace('${x.id}')"><span class="mark">${state.done.includes(x.id)?'✓ 완료':'›'}</span><strong>${x.name}</strong><small>${state.done.includes(x.id)?'기억 도장과 기록 다시 보기':'이곳의 이야기를 펼쳐 보기'}</small></button>`).join('')}</div><div class="spacer"></div><div class="footer">${btn('다른 장소 살펴보기',"go('select')",'secondary')}${completed.length?btn('여기서 유람 마치기',"finishTour()"):'<p class="footnote">장소를 한 곳 이상 완료하면 유람을 마칠 수 있습니다.</p>'}</div>`}
if(state.screen==='story'){const story=STORIES[p.id];const index=Math.max(0,Math.min(Number(state.storyPage)||0,story.pages.length-1));const page=story.pages[index];html=`${navHeader('journey',3)}<div class="center" style="padding:24px 0 15px"><div class="chapter">장소의 이야기 · ${p.name}</div><h2 class="title" style="font-size:28px">${story.title}</h2><p class="subtitle">${index+1} / ${story.pages.length} 장</p></div><div class="spacer"></div>${page[0]==='여종'?`<div class="center"><div class="portrait"><div class="circle">${person}</div></div></div>`:''}<div class="paper fade"><div class="name">${page[0]==='여종'?'유람첩의 안내자 · 여종':'오래된 유람첩에서'}</div><p class="dialogue">“${page[1]}”</p></div><div class="spacer"></div><div class="footer">${index>0?btn('이전 이야기','previousStory()','secondary'):''}${btn(index===story.pages.length-1?'오늘의 장소 살펴보기':'다음 이야기','advanceStory()')}<p class="footnote">이 이야기는 관광 경험을 위해 창작한 허구입니다.</p></div>`}
if(state.screen==='guide'){const guide=GUIDES[p.id];const index=Math.max(0,Math.min(Number(state.guidePage)||0,guide.pages.length-1));const page=guide.pages[index];html=`${navHeader('story',3)}<div class="center" style="padding:24px 0 15px"><div class="chapter">여주를 알아가는 길 · ${p.name}</div><h2 class="title" style="font-size:28px">${page.title}</h2><p class="subtitle">관광 가이드 ${index+1} / ${guide.pages.length}</p></div><div class="spacer"></div><div class="paper fade"><div class="name">${page.label}</div><p>${page.body}</p><div class="divider"></div><div class="guide-point"><strong>✦ 오늘의 관람 포인트</strong><p>${page.point}</p></div></div><div class="spacer"></div><div class="footer">${index>0?btn('이전 안내','previousGuide()','secondary'):''}${btn(index===guide.pages.length-1?'임시 미션으로 이동':'다음 안내','advanceGuide()')}<p class="footnote">관광 정보 · 전시 구성 및 관람 동선은 현장 사정에 따라 달라질 수 있습니다.</p></div>`}
if(state.screen==='place'&&state.active==='museum'){
 const step=Math.max(0,Math.min(2,Number(state.museumMissionStep)||0));
 const tasks=[
  {title:'왕비의 고장',desc:'여주는 고려·조선 시대에 여러 왕비와 빈을 배출한 고장입니다. 여주 출신 조선 왕비 8명의 이름을 확인할 수 있는 왕실 족보의 명칭은 무엇일까요?',hint:'전시 안내에서 「왕비의 고장」을 찾아보세요. 팀 답사 자료에는 3층으로 표시되어 있어요.',photo:''},
  {title:'대한민국 임시정부',desc:'사진 속 두 인물의 이름을 왼쪽부터 차례로 적어 보세요.',hint:'「대한민국 임시정부」 관련 전시를 살펴보세요. 팀 답사 자료에는 3층으로 표시되어 있어요.',photo:MUSEUM_IMAGES[0]},
  {title:'교통의 중심 여주',desc:'전시에서 이포나루와 조포나루 사진의 촬영 연도를 각각 찾아보세요. 두 연도를 더하면 얼마일까요?',hint:'「교통의 중심 여주」 전시 자료를 살펴보세요. 팀 답사 자료에는 3층으로 표시되어 있어요.',photo:MUSEUM_IMAGES[1]}
 ];
 const t=tasks[step];
 html=`${navHeader('journey',3)}<div class="center" style="padding:20px 0 8px"><div class="chapter">여주박물관 · 실제 미션</div><h2 class="title" style="font-size:28px">${t.title}</h2><div class="mission-step">미션 ${step+1} / 3</div></div><div class="paper museum-task fade"><div class="name">아씨의 현장 탐방</div><p>${t.desc}</p>${t.photo?`<img class="museum-photo" src="${t.photo}" alt="${step===1?'두 인물이 함께 있는 역사 사진':'이포나루와 조포나루의 역사 사진 (연도 표기 제외)'}">`:''}${step===1?`<label for="museumAnswerA" class="small">첫 번째 인물</label><input class="mission-input" id="museumAnswerA" placeholder="왼쪽 인물 이름" autocomplete="off"><label for="museumAnswerB" class="small">두 번째 인물</label><input class="mission-input" id="museumAnswerB" placeholder="오른쪽 인물 이름" autocomplete="off">`:`<label for="museumAnswerA" class="small">정답 입력</label><input class="mission-input" id="museumAnswerA" placeholder="답을 적어 주세요" autocomplete="off" inputmode="${step===2?'numeric':'text'}">`}<button class="hint-toggle" onclick="toggleMuseumHint()" aria-expanded="false" id="museumHintButton">힌트 보기 ▾</button><div id="museumHint" class="mission-feedback" style="display:none">${t.hint}<br><small>전시 위치나 구성은 방문 시기에 따라 달라질 수 있어요.</small></div><div id="museumFeedback" role="status" aria-live="polite"></div></div><div class="spacer"></div><div class="footer">${btn(step===2?'정답 확인하고 도장 받기':'정답 확인하고 다음 미션','checkMuseumAnswer()')}${step>0?btn('이전 미션','previousMuseumMission()','secondary'):''}<p class="footnote">미션은 팀 현장 답사 자료를 바탕으로 구성했습니다.</p></div>`;
}
if(state.screen==='place'&&state.active!=='museum')html=`${navHeader('journey',3)}<div class="center" style="padding-top:20px"><div class="chapter">오늘의 장소 · 임시 체험</div><h2 class="title" style="font-size:32px">${p.name}</h2><div class="small">${p.tag}</div></div><div class="location-art">${landscape}</div><div class="paper"><div class="name">오래된 유람첩에서</div><p>“${p.line}”</p></div><div class="mission"><strong>오늘의 미션 · 임시 체험</strong><br>${p.hint}<br><span style="font-size:12px;color:#8b7963">※ 실제 팀 미션이 확정되면 이 부분을 교체합니다.</span></div><div class="spacer"></div><div class="footer">${btn('미션 완료하고 도장 받기',"completeMission()")}</div>`;
if(state.screen==='memory')html=`${navHeader('journey',3)}<div class="spacer"></div><div class="center"><div class="chapter">기억 도장 획득</div><h2 class="title" style="font-size:29px">${p.name}의 기억</h2><div class="stamp"><div><strong>${p.symbol}</strong><br>${p.name}</div></div><p class="subtitle">오늘 이곳에 머문 아씨의 발자취가<br>유람첩에 남았습니다.</p></div><div class="divider"></div><div class="paper"><div class="name">아씨의 한 줄 기록 · 선택 사항</div><p style="font-size:13px;color:var(--sub)">오늘 가장 마음에 남은 순간을 적어 보세요.</p><input id="note" class="note" maxlength="100" placeholder="나만의 기억을 적어 주세요" value="${esc(state.notes[p.id]||'')}"></div><div class="spacer"></div><div class="footer">${btn('유람첩에 기록하기',"saveNote()")}</div>`;
if(state.screen==='ending'){let selected=PLACES.filter(x=>state.done.includes(x.id));html=`${navHeader('journey',4)}<div class="center" style="padding:20px 0 8px"><div class="chapter">마지막 장 · 다시 만난 계절</div><h2 class="title" style="font-size:30px">마지막 페이지</h2></div><div class="paper fade"><div class="center ornament">❧</div><p class="endtext">오래전 한 여인이<br>이 땅을 거닐었습니다.<br><br>그 여인의 유람첩은<br>오랫동안 마지막 장이 비어 있었지요.<br><br>그런데 오늘,<br><em>아씨의 발자취가 그 빈자리를 채웠습니다.</em></p><div class="divider"></div><p class="endtext" style="font-size:15px">“참 오래 기다렸습니다, 아씨.<br>어쩌면 아씨께서는<br>이 길을 처음 걷는 것이<br>아닐지도 모르겠네요.”</p><div class="center"><div class="small">— 유람첩의 안내자</div></div></div><div class="center" style="padding-top:22px"><div class="small">오늘의 여주 · 나의 기억</div><div class="stamps">${selected.map(x=>`<div class="stamp"><div><strong>${x.symbol}</strong><br>${x.name}</div></div>`).join('')}</div>${selected.map(x=>`<p style="font-size:13px;line-height:1.8"><b>${x.name}</b> · ${esc(state.notes[x.id]||'오늘의 풍경을 마음에 담았습니다.')}</p>`).join('')}</div><div class="spacer"></div><div class="footer">${btn('처음으로 돌아가기',"resetTour()",'secondary')}<p class="footnote">기억은 돌아오지 않아도, 새로운 이야기는 남습니다.</p></div>`}
app.innerHTML=html;if(state.screen==='select')initTourMap()}
// 지도 원본의 Leaflet 좌표를 그대로 사용합니다. 지도 오류가 나도 기존 버튼은 작동합니다.
function initTourMap(){
 const el=document.getElementById('tour-map');if(!el)return;
 const fallback=()=>{el.style.display='none';const msg=document.getElementById('tour-map-fallback');if(msg)msg.classList.add('visible')};
 if(typeof L==='undefined'){fallback();return}
 try{
  tourMapInstance=L.map(el,{scrollWheelZoom:false,zoomControl:true,attributionControl:true});
  const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'});
  tiles.addTo(tourMapInstance);
  const spots=[
   {id:'museum',n:1,name:'여주박물관',lat:37.2996196,lon:127.6533694,color:'#557d70'},
   {id:'ceramic',n:2,name:'여주도자세상',lat:37.30016494157502,lon:127.6553947278396,color:'#ad8746'},
   {id:'silleuksa',n:3,name:'신륵사',lat:37.2974985,lon:127.6615769,color:'#bd7059'}
  ];
  for(const s of spots){
   const icon=L.divIcon({className:'',html:`<div class="tour-map-pin" style="background:${s.color}"><span>${s.n}</span></div>`,iconSize:[35,40],iconAnchor:[17,36]});
   L.marker([s.lat,s.lon],{icon,title:s.name,keyboard:true}).addTo(tourMapInstance).on('click',()=>openPlace(s.id));
  }
  tourMapInitialBounds=L.latLngBounds(spots.map(s=>[s.lat,s.lon])).pad(.35);
  tourMapInstance.fitBounds(tourMapInitialBounds,{maxZoom:16});
  requestAnimationFrame(()=>{if(tourMapInstance)tourMapInstance.invalidateSize()});
 }catch(err){console.warn('지도 표시 실패:',err);if(tourMapInstance){tourMapInstance.remove();tourMapInstance=null}fallback()}
}
function resetTourMapView(){if(tourMapInstance&&tourMapInitialBounds){tourMapInstance.fitBounds(tourMapInitialBounds,{maxZoom:16,animate:true})}}
function openPlace(id){if(!PLACES.some(p=>p.id===id))return;state.selected=[...new Set([...state.selected,id])];go('story',{active:id,storyPage:0})};function advanceStory(){const story=STORIES[state.active];if(!story)return go('journey');if(state.storyPage<story.pages.length-1){state.storyPage++;save();render()}else go('guide',{guidePage:0})};function previousStory(){state.storyPage=Math.max(0,(state.storyPage||0)-1);save();render()};function advanceGuide(){const guide=GUIDES[state.active];if(!guide)return go('journey');if((state.guidePage||0)<guide.pages.length-1){state.guidePage++;save();render()}else go('place',{museumMissionStep:0})};function previousGuide(){state.guidePage=Math.max(0,(state.guidePage||0)-1);save();render()};function finishTour(){if(!state.done.length)return alert('한 곳 이상 유람한 뒤 마지막 페이지를 펼칠 수 있습니다.');go('ending')};function advanceIntro(){if(state.dialogue<3){state.dialogue++;save();render()}else go('select')};function togglePlace(id){if(state.done.length)return alert('진행 중인 유람은 장소를 변경할 수 없습니다.');state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];save();render()};function toggleMuseumHint(){const h=document.getElementById('museumHint'),b=document.getElementById('museumHintButton');if(!h||!b)return;const show=h.style.display==='none';h.style.display=show?'block':'none';b.textContent=show?'힌트 접기 ▴':'힌트 보기 ▾';b.setAttribute('aria-expanded',String(show))};
function checkMuseumAnswer(){const step=Number(state.museumMissionStep)||0;const a=(document.getElementById('museumAnswerA')?.value||'').replace(/\s+/g,'').toLowerCase();const b=(document.getElementById('museumAnswerB')?.value||'').replace(/\s+/g,'').toLowerCase();const ok=step===0?a==='선원계보기략':step===1?(a==='이숙진'||a==='이숙진여사')&&(b==='조성환'||b==='조성환선생'):a.replace(/,/g,'')==='3905';const fb=document.getElementById('museumFeedback');if(!ok){if(fb)fb.innerHTML='<div class="mission-feedback">아직 정답이 아니에요. 전시를 다시 살펴보거나 힌트를 확인해 주세요.</div>';return;}if(step<2){state.museumMissionStep=step+1;save();render();window.scrollTo(0,0)}else{state.museumMissionStep=0;completeMission()}};
function previousMuseumMission(){state.museumMissionStep=Math.max(0,(Number(state.museumMissionStep)||0)-1);save();render()};
function completeMission(){if(!state.done.includes(state.active))state.done.push(state.active);if(!state.selected.includes(state.active))state.selected.push(state.active);go('memory')};function saveNote(){state.notes[state.active]=document.getElementById('note').value.trim();go('journey')};function resetTour(){if(!confirm('유람을 처음부터 다시 시작할까요? 기존 기록이 초기화됩니다.'))return;state={screen:'home',dialogue:0,storyPage:0,guidePage:0,museumMissionStep:0,selected:[],done:[],notes:{},active:null};save();render()};try{render()}catch(error){console.error(error);app.innerHTML=`<div style="margin:auto;text-align:center;padding:40px"><h1>아씨의 여주 유람</h1><p>화면을 불러오는 중 오류가 발생했습니다.</p><button onclick="localStorage.removeItem('yeoju-tour-v1');location.reload()" style="padding:14px;background:#426c61;color:white;border:0">처음부터 다시 시작</button></div>`}
</script></body></html>
