<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ede3d0"><title>아씨의 여주 유람</title><style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap');
:root{--ink:#383a31;--sub:#726f60;--paper:#f7f0df;--jade:#426c61;--gold:#a7814a;--line:#cfc2a6}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#c8c2b3;font-family:'Gowun Batang',serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:460px;min-height:100dvh;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 70% 10%,#fff9e8 0,transparent 45%),linear-gradient(145deg,#f6edd9,#e9dec6);box-shadow:0 0 60px #0002}.shell:before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.6' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.15'/%3E%3C/svg%3E")}main{position:relative;z-index:1;min-height:100dvh;padding:28px 25px 36px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;min-height:40px}.small{font-size:12px;color:var(--sub);letter-spacing:2px}.back{border:1px solid var(--line);border-radius:50%;background:#f7f0dfb8;width:37px;height:37px;color:var(--ink);font-size:20px}.progress{display:flex;gap:5px}.progress span{width:22px;height:4px;background:#cfc4ad;border-radius:9px}.progress span.on{background:var(--jade)}.center{text-align:center}.spacer{flex:1}.eyebrow{font-size:12px;letter-spacing:4px;color:var(--jade);font-weight:bold}.title{font-family:'Noto Serif KR',serif;font-weight:600;font-size:clamp(34px,9vw,46px);line-height:1.35;letter-spacing:-2px;margin:14px 0}.subtitle{font-size:14px;line-height:2;color:var(--sub)}.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:22px 0}.button{width:100%;border:1px solid #31594f;background:var(--jade);color:#fffaf0;padding:16px 15px;border-radius:5px;font-size:15px;letter-spacing:2px;box-shadow:3px 4px 0 #2d5146;transition:transform .15s}.button:active{transform:translate(2px,2px);box-shadow:1px 2px 0 #2d5146}.button.secondary{background:transparent;color:var(--jade);box-shadow:none;border:1px solid var(--jade)}.button:disabled{opacity:.45;cursor:not-allowed}.footnote{font-size:11px;text-align:center;color:#857d6c;margin:15px 0}.scene{position:relative;height:310px;margin:30px -25px 10px;overflow:hidden}.scene svg{width:100%;height:100%}.scene:after{content:'';position:absolute;bottom:0;left:0;right:0;height:70px;background:linear-gradient(transparent,#eee3ce)}.seal{display:inline-flex;border:2px solid #9c654e;color:#9c654e;font-size:15px;align-items:center;justify-content:center;padding:8px;line-height:1.4;transform:rotate(-9deg)}.paper{background:#fbf6e9e8;border:1px solid #d8c8aa;padding:24px 22px;box-shadow:0 9px 28px #6a593020;position:relative}.paper:before,.paper:after{content:'❧';position:absolute;color:#b6a483;font-size:17px}.paper:before{top:8px;left:12px}.paper:after{bottom:8px;right:12px;transform:rotate(180deg)}.paper p{font-size:15px;line-height:2.15;margin:12px 0;word-break:keep-all}.chapter{font-size:12px;color:var(--jade);letter-spacing:3px}.portrait{height:160px;display:flex;align-items:center;justify-content:center;position:relative}.portrait .circle{border:1px solid #c5b693;width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#e6e5d4,#d5d8c5);font-size:68px;color:#657568}.portrait .circle svg{width:120px;height:120px}.name{color:var(--jade);font-size:13px;letter-spacing:3px}.dialogue{font-size:17px;line-height:2.1;min-height:130px}.choices{display:grid;gap:12px;margin-top:22px}.choice{border:1px solid #cbbd9e;background:#fff9edb8;padding:17px 15px;text-align:left;border-radius:4px;color:var(--ink)}.choice.active{border:2px solid var(--jade);background:#e6ece3;padding:16px 14px}.choice strong{display:block;font-size:17px;margin-bottom:7px}.choice small{font-size:12px;line-height:1.6;color:var(--sub)}.choice .mark{float:right;color:var(--jade)}.badge{display:inline-block;font-size:11px;border:1px solid #b7a88c;padding:5px 8px;color:#786c53;letter-spacing:1px}.location-art{height:190px;margin:16px 0;background:linear-gradient(#e7e4d3,#c6d3c1);border:7px solid #f9f3e5;outline:1px solid #c5b79b;display:grid;place-items:center;overflow:hidden}.location-art svg{width:100%;height:100%}.mission{background:#f9f4e8;border-left:3px solid var(--jade);padding:17px 18px;margin:20px 0;line-height:1.9;font-size:14px}.stamp{width:116px;height:116px;border:4px double #a35d4b;border-radius:50%;display:grid;place-items:center;color:#a35d4b;transform:rotate(-12deg);font-size:17px;line-height:1.5;margin:22px auto;background:#f9eddd}.stamp strong{font-size:22px}.stamps{display:flex;justify-content:center;gap:16px;margin:20px 0}.stamps .stamp{width:90px;height:90px;font-size:13px;margin:0}.stamps .stamp strong{font-size:16px}.note{width:100%;padding:14px;border:1px solid var(--line);background:#fffaf0;color:var(--ink);border-radius:4px;font-size:14px}.ornament{font-size:32px;color:var(--gold);letter-spacing:8px}.fade{animation:fade .45s ease both}@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.footer{margin-top:auto;padding-top:25px}.selected-count{color:var(--jade);font-size:13px;margin:15px 0}.bookcover{height:260px;margin:32px auto 25px;width:205px;border:9px double #9c815c;border-radius:3px;background:linear-gradient(145deg,#59776c,#304f47);box-shadow:9px 11px 0 #c9b899,13px 17px 24px #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f5e5bd}.bookcover .vertical{writing-mode:vertical-rl;letter-spacing:10px;font-size:29px;font-family:'Noto Serif KR',serif}.bookcover .line{width:65%;height:1px;background:#d8c399;margin:15px}.mini-link{border:0;background:none;color:var(--sub);text-decoration:underline;font-size:12px;padding:10px}.endtext{font-size:17px;line-height:2.4;text-align:center}.endtext em{color:var(--jade);font-style:normal;font-weight:bold}@media(min-width:500px){.shell{margin:28px auto;min-height:820px;border-radius:8px}main{min-height:820px}}@media(max-height:720px){.scene{height:230px;margin-top:12px}.bookcover{height:210px;margin:15px auto}}
</style></head><body><div class="shell"><main id="app" aria-live="polite"></main></div><script>
const PLACES=[{id:'silleuksa',name:'신륵사',tag:'남한강 곁에 머문 시간',desc:'강가에 자리한 사찰에서 오래된 풍경을 만납니다.',hint:'강과 사찰이 만나는 풍경을 바라보며 오늘 가장 마음에 남은 것을 떠올려 보세요.',line:'물길을 따라 흐른 세월은, 누구의 기억도 같은 모습으로 남겨 두지 않는구나.',symbol:'山'},{id:'ceramic',name:'여주도자세상',tag:'흙이 품은 이야기',desc:'여주의 도자 문화를 만나고 나만의 감상을 남깁니다.',hint:'도자기의 모양이나 무늬를 살펴보고 마음에 남는 하나를 골라 보세요.',line:'같은 흙에서 태어나도 저마다 다른 빛을 품는구나.',symbol:'土'},{id:'museum',name:'여주박물관',tag:'기록 너머의 이야기',desc:'여주에 남겨진 기록과 유물을 통해 시간을 돌아봅니다.',hint:'전시에서 가장 기억에 남는 물건이나 이야기를 하나 찾아보세요.',line:'기록되지 않은 마음도 분명 이곳에 머물렀겠지.',symbol:'文'}];
const KEY='yeoju-tour-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state={screen:'home',dialogue:0,selected:[],done:[],notes:{},active:null,...state};const app=document.getElementById('app');const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const go=(screen,extra={})=>{Object.assign(state,{screen,...extra});save();render();window.scrollTo(0,0)};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(label,fn='next()',cls='')=>`<button class="button ${cls}" onclick="${fn}">${label}</button>`;const top=(back='',step=0)=>`<div class="top"><div>${back?`<button class="back" onclick="go('${back}')" aria-label="뒤로 가기">‹</button>`:'<span class="small">YE O JU · TRAVEL JOURNAL</span>'}</div><div class="progress">${[1,2,3,4].map(n=>`<span class="${n<=step?'on':''}"></span>`).join('')}</div></div>`;
const landscape=`<svg viewBox="0 0 460 310" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d6d9cc"/><stop offset="1" stop-color="#f5e8c8"/></linearGradient></defs><rect width="460" height="310" fill="url(#sky)"/><circle cx="352" cy="75" r="43" fill="#e6c99a" opacity=".75"/><path d="M0 175 Q70 90 150 169 Q215 113 287 168 Q363 103 460 165 V310 H0" fill="#9daea0" opacity=".65"/><path d="M0 210 Q105 146 225 203 Q335 150 460 205 V310 H0" fill="#6c8b7d" opacity=".75"/><path d="M0 250 Q155 217 260 244 Q360 224 460 249 V310 H0" fill="#5e7b6e"/><path d="M0 275 Q150 250 270 273 Q360 259 460 275 V310 H0" fill="#d3d7c6"/><path d="M-30 283 Q150 260 480 285" stroke="#e6e4d5" stroke-width="14" fill="none"/><g transform="translate(85 148)" fill="#4c6258"><path d="M0 43 L85 43 L85 89 L0 89Z"/><path d="M-17 45 L42 10 L102 45Z"/><path d="M9 7 L42 -8 L77 7Z"/><path d="M38 51 H49 V89 H38Z" fill="#d8d3bb"/></g><path d="M20 0 Q55 100 22 180 M35 18 Q90 50 125 45 M24 62 Q75 95 110 93" stroke="#5f7868" stroke-width="7" fill="none" opacity=".6"/></svg>`;
const person=`<svg viewBox="0 0 130 140" aria-hidden="true"><path d="M31 124 Q19 85 45 75 H84 Q110 86 98 124Z" fill="#7b8c80"/><path d="M45 74 Q37 56 43 40 Q47 15 67 15 Q91 15 94 42 L88 75Z" fill="#363a35"/><ellipse cx="67" cy="58" rx="24" ry="32" fill="#dec7a9"/><path d="M43 45 Q50 29 65 34 Q77 30 90 45 Q80 13 65 18 Q46 18 43 45" fill="#353b36"/><path d="M55 59 h5 m15 0 h5" stroke="#4d493e" stroke-width="2" stroke-linecap="round"/><path d="M64 76 q5 4 10 0" stroke="#9e7565" stroke-width="1.5" fill="none"/><path d="M37 108 Q65 92 98 108" stroke="#c1b8a1" stroke-width="6" fill="none"/><path d="M40 42 Q65 26 93 42" stroke="#4c554c" stroke-width="8" fill="none"/></svg>`;
function render(){const p=PLACES.find(x=>x.id===state.active);let html='';if(state.screen==='home')html=`${top()}<div class="spacer"></div><div class="center fade"><div class="eyebrow">여주의 시간을 걷다</div><div class="scene">${landscape}</div><div class="ornament">❦</div><h1 class="title">아씨의<br>여주 유람</h1><p class="subtitle">오래된 기록의 끝에서<br>오늘, 당신의 이야기가 시작됩니다.</p></div><div class="spacer"></div><div class="footer">${btn('유람 시작하기',"go('intro',{dialogue:0})")}<p class="footnote">여주에서 펼쳐지는 나만의 유람첩</p></div>`;
if(state.screen==='intro'){let lines=[['여종','아씨, 먼 길 오시느라 고생 많으셨습니다.'],['여종','이 유람첩에는 오래전 여주를 거닐었던 한 여인의 발자취가 남아 있답니다.'],['여종','허나 이상하지요. 어디를 다녀왔는지는 적혀 있는데, 그곳에서 무엇을 느꼈는지는 비어 있으니 말입니다.'],['여종','이제 아씨께서 마음이 가는 두 곳을 골라, 아씨만의 여주를 남겨 주시겠습니까?']];let d=lines[Math.min(state.dialogue,lines.length-1)];html=`${top('home',1)}<div class="spacer"></div><div class="center"><div class="chapter">첫 번째 장 · 초대</div><div class="portrait"><div class="circle">${person}</div></div><div class="name">유람첩의 안내자 · 여종</div></div><div class="paper fade" key="${state.dialogue}"><p class="dialogue">“${d[1]}”</p><div class="small" style="text-align:right">${state.dialogue+1} / ${lines.length}</div></div><div class="spacer"></div><div class="footer">${btn(state.dialogue===3?'유람첩 펼치기':'다음 이야기', 'advanceIntro()')}</div>`}
if(state.screen==='select')html=`${top('intro',2)}<div class="center" style="padding:24px 0 5px"><div class="chapter">두 번째 장 · 길을 고르다</div><h2 class="title" style="font-size:29px">어디로 떠나시겠습니까?</h2><p class="subtitle">마음이 머무는 장소 두 곳을 골라 주세요.</p></div><div class="choices">${PLACES.map(x=>`<button class="choice ${state.selected.includes(x.id)?'active':''}" onclick="togglePlace('${x.id}')"><span class="mark">${state.selected.includes(x.id)?'✓':''}</span><strong>${x.name}</strong><small>${x.tag}<br>${x.desc}</small></button>`).join('')}</div><div class="spacer"></div><div class="footer"><p class="selected-count center">${state.selected.length} / 2곳 선택</p>${btn('이 길로 떠나기',"go('journey')",'') .replace('<button','<button '+(state.selected.length!==2?'disabled':''))}</div>`;
if(state.screen==='journey'){const remaining=state.selected.filter(id=>!state.done.includes(id));html=`${top('select',3)}<div class="center" style="padding:28px 0 8px"><div class="chapter">세 번째 장 · 발자취를 남기다</div><h2 class="title" style="font-size:30px">아씨의 유람길</h2><p class="subtitle">한 곳씩 둘러보며 기억 도장을 모아 보세요.</p></div><div class="paper" style="margin-top:20px"><div class="center"><div class="small">기억 도장</div><div class="stamps">${state.selected.map(id=>{let x=PLACES.find(z=>z.id===id);return `<div class="stamp" style="${state.done.includes(id)?'':'opacity:.25;filter:grayscale(1)'}"><div><strong>${x.symbol}</strong><br>${x.name}</div></div>`}).join('')}</div></div></div><div class="choices">${state.selected.map(id=>{let x=PLACES.find(z=>z.id===id);return `<button class="choice" onclick="go('${state.done.includes(id)?'memory':'place'}',{active:'${id}'})"><span class="mark">${state.done.includes(id)?'✓ 완료':'›'}</span><strong>${x.name}</strong><small>${state.done.includes(id)?'기억 도장과 기록 다시 보기':'이곳의 이야기를 펼쳐 보기'}</small></button>`}).join('')}</div><div class="spacer"></div><div class="footer">${remaining.length===0?btn('마지막 페이지 펼치기',"go('ending')"): `<p class="footnote">두 장소의 도장을 모으면 마지막 페이지가 열립니다.</p>`}</div>`}
if(state.screen==='place')html=`${top('journey',3)}<div class="center" style="padding-top:20px"><div class="chapter">장소의 기록</div><h2 class="title" style="font-size:32px">${p.name}</h2><div class="small">${p.tag}</div></div><div class="location-art">${landscape}</div><div class="paper"><div class="name">오래된 유람첩에서</div><p>“${p.line}”</p></div><div class="mission"><strong>오늘의 미션 · 임시 체험</strong><br>${p.hint}<br><span style="font-size:12px;color:#8b7963">※ 실제 팀 미션이 확정되면 이 부분을 교체합니다.</span></div><div class="spacer"></div><div class="footer">${btn('미션 완료하고 도장 받기',"completeMission()")}</div>`;
if(state.screen==='memory')html=`${top('journey',3)}<div class="spacer"></div><div class="center"><div class="chapter">기억 도장 획득</div><h2 class="title" style="font-size:29px">${p.name}의 기억</h2><div class="stamp"><div><strong>${p.symbol}</strong><br>${p.name}</div></div><p class="subtitle">오늘 이곳에 머문 아씨의 발자취가<br>유람첩에 남았습니다.</p></div><div class="divider"></div><div class="paper"><div class="name">아씨의 한 줄 기록 · 선택 사항</div><p style="font-size:13px;color:var(--sub)">오늘 가장 마음에 남은 순간을 적어 보세요.</p><input id="note" class="note" maxlength="100" placeholder="나만의 기억을 적어 주세요" value="${esc(state.notes[p.id]||'')}"></div><div class="spacer"></div><div class="footer">${btn('유람첩에 기록하기',"saveNote()")}</div>`;
if(state.screen==='ending'){let selected=state.selected.map(id=>PLACES.find(x=>x.id===id));html=`${top('journey',4)}<div class="center" style="padding:20px 0 8px"><div class="chapter">마지막 장 · 다시 만난 계절</div><h2 class="title" style="font-size:30px">마지막 페이지</h2></div><div class="paper fade"><div class="center ornament">❧</div><p class="endtext">오래전 한 여인이<br>이 땅을 거닐었습니다.<br><br>그 여인의 유람첩은<br>오랫동안 마지막 장이 비어 있었지요.<br><br>그런데 오늘,<br><em>아씨의 발자취가 그 빈자리를 채웠습니다.</em></p><div class="divider"></div><p class="endtext" style="font-size:15px">“참 오래 기다렸습니다, 아씨.<br>어쩌면 아씨께서는<br>이 길을 처음 걷는 것이<br>아닐지도 모르겠네요.”</p><div class="center"><div class="small">— 유람첩의 안내자</div></div></div><div class="center" style="padding-top:22px"><div class="small">오늘의 여주 · 나의 기억</div><div class="stamps">${selected.map(x=>`<div class="stamp"><div><strong>${x.symbol}</strong><br>${x.name}</div></div>`).join('')}</div>${selected.map(x=>`<p style="font-size:13px;line-height:1.8"><b>${x.name}</b> · ${esc(state.notes[x.id]||'오늘의 풍경을 마음에 담았습니다.')}</p>`).join('')}</div><div class="spacer"></div><div class="footer">${btn('처음으로 돌아가기',"resetTour()",'secondary')}<p class="footnote">기억은 돌아오지 않아도, 새로운 이야기는 남습니다.</p></div>`}
app.innerHTML=html}
function advanceIntro(){if(state.dialogue<3){state.dialogue++;save();render()}else go('select')};function togglePlace(id){if(state.done.length)return alert('진행 중인 유람은 장소를 변경할 수 없습니다.');state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):state.selected.length<2?[...state.selected,id]:state.selected;save();render()};function completeMission(){if(!state.done.includes(state.active))state.done.push(state.active);go('memory')};function saveNote(){state.notes[state.active]=document.getElementById('note').value.trim();go('journey')};function resetTour(){if(!confirm('유람을 처음부터 다시 시작할까요? 기존 기록이 초기화됩니다.'))return;state={screen:'home',dialogue:0,selected:[],done:[],notes:{},active:null};save();render()};render();
</script></body></html>
