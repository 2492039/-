function render(){const p=PLACES.find(x=>x.id===state.active);let html='';if(state.screen==='home')html=`${navHeader()}<div class="spacer"></div><div class="center fade"><div class="eyebrow">여주의 시간을 걷다</div><div class="scene">${landscape}</div><div class="ornament">❦</div><h1 class="title">아씨의<br>여주 유람</h1><p class="subtitle">오래된 기록의 끝에서<br>오늘, 당신의 이야기가 시작됩니다.</p></div><div class="spacer"></div><div class="footer">${btn('유람 시작하기',"go('intro',{dialogue:0})")}<p class="footnote">여주에서 펼쳐지는 나만의 유람첩</p></div>`;
if(state.screen==='intro'){let lines=[['여종','아씨, 먼 길 오시느라 고생 많으셨습니다.'],['여종','이 유람첩에는 오래전 여주를 거닐었던 한 여인의 발자취가 남아 있답니다.'],['여종','허나 이상하지요. 어디를 다녀왔는지는 적혀 있는데, 그곳에서 무엇을 느꼈는지는 비어 있으니 말입니다.'],['여종','이제 마음이 가는 곳부터 자유롭게 둘러보시지요. 언제든 아씨의 유람을 마칠 수 있답니다.']];let d=lines[Math.min(state.dialogue,lines.length-1)];html=`${navHeader('home',1)}<div class="spacer"></div><div class="center"><div class="chapter">첫 번째 장 · 초대</div><div class="portrait"><div class="circle">${person}</div></div><div class="name">유람첩의 안내자 · 여종</div></div><div class="paper fade" key="${state.dialogue}"><p class="dialogue">“${d[1]}”</p><div class="small" style="text-align:right">${state.dialogue+1} / ${lines.length}</div></div><div class="spacer"></div><div class="footer">${btn(state.dialogue===3?'유람첩 펼치기':'다음 이야기', 'advanceIntro()')}</div>`}
if(state.screen==='select')html=`${navHeader('intro',2)}<div class="center" style="padding:24px 0 5px"><div class="chapter">두 번째 장 · 길을 고르다</div><h2 class="title" style="font-size:29px">어디로 떠나시겠습니까?</h2><p class="subtitle">원하는 장소부터 자유롭게 둘러보세요.<br>순서와 방문 횟수에는 제한이 없습니다.</p></div><div class="choices">${PLACES.map(x=>`<button class="choice" onclick="openPlace('${x.id}')"><span class="mark">${state.done.includes(x.id)?'✓ 완료':'›'}</span><strong>${x.name}</strong><small>${x.tag}<br>${state.done.includes(x.id)?'기록 다시 보기':x.desc}</small></button>`).join('')}</div><div class="spacer"></div><div class="footer">${btn('나의 유람첩 보기',"go('journey')",'secondary')}</div>`;
if(state.screen==='journey'){const completed=PLACES.filter(x=>state.done.includes(x.id));html=`${navHeader('select',3)}<div class="center" style="padding:28px 0 8px"><div class="chapter">세 번째 장 · 발자취를 남기다</div><h2 class="title" style="font-size:30px">아씨의 유람길</h2><p class="subtitle">마음이 가는 곳을 언제든 방문해 보세요.</p></div><div class="paper" style="margin-top:20px"><div class="center"><div class="small">기억 도장 · ${completed.length} / ${PLACES.length}</div><div class="stamps">${PLACES.map(x=>`<div class="stamp" style="${state.done.includes(x.id)?'':'opacity:.25;filter:grayscale(1)'}"><div><strong>${x.symbol}</strong><br>${x.name}</div></div>`).join('')}</div></div></div><div class="choices">${PLACES.map(x=>`<button class="choice" onclick="openPlace('${x.id}')"><span class="mark">${state.done.includes(x.id)?'✓ 완료':'›'}</span><strong>${x.name}</strong><small>${state.done.includes(x.id)?'기억 도장과 기록 다시 보기':'이곳의 이야기를 펼쳐 보기'}</small></button>`).join('')}</div><div class="spacer"></div><div class="footer">${btn('다른 장소 살펴보기',"go('select')",'secondary')}${completed.length?btn('여기서 유람 마치기',"finishTour()"):'<p class="footnote">장소를 한 곳 이상 완료하면 유람을 마칠 수 있습니다.</p>'}</div>`}
if(state.screen==='story'){const story=STORIES[p.id];const index=Math.max(0,Math.min(Number(state.storyPage)||0,story.pages.length-1));const page=story.pages[index];html=`${navHeader('journey',3)}<div class="center" style="padding:24px 0 15px"><div class="chapter">장소의 이야기 · ${p.name}</div><h2 class="title" style="font-size:28px">${story.title}</h2><p class="subtitle">${index+1} / ${story.pages.length} 장</p></div><div class="spacer"></div>${page[0]==='여종'?`<div class="center"><div class="portrait"><div class="circle">${person}</div></div></div>`:''}<div class="paper fade"><div class="name">${page[0]==='여종'?'유람첩의 안내자 · 여종':'오래된 유람첩에서'}</div><p class="dialogue">“${page[1]}”</p></div><div class="spacer"></div><div class="footer">${index>0?btn('이전 이야기','previousStory()','secondary'):''}${btn(index===story.pages.length-1?'오늘의 장소 살펴보기':'다음 이야기','advanceStory()')}<p class="footnote">이 이야기는 관광 경험을 위해 창작한 허구입니다.</p></div>`}
if(state.screen==='guide'){const guide=GUIDES[p.id];const index=Math.max(0,Math.min(Number(state.guidePage)||0,guide.pages.length-1));const page=guide.pages[index];html=`${navHeader('story',3)}<div class="center" style="padding:24px 0 15px"><div class="chapter">여주를 알아가는 길 · ${p.name}</div><h2 class="title" style="font-size:28px">${page.title}</h2><p class="subtitle">관광 가이드 ${index+1} / ${guide.pages.length}</p></div><div class="spacer"></div><div class="paper fade"><div class="name">${page.label}</div><p>${page.body}</p><div class="divider"></div><div class="guide-point"><strong>✦ 오늘의 관람 포인트</strong><p>${page.point}</p></div></div><div class="spacer"></div><div class="footer">${index>0?btn('이전 안내','previousGuide()','secondary'):''}${btn(index===guide.pages.length-1?'임시 미션으로 이동':'다음 안내','advanceGuide()')}<p class="footnote">관광 정보 · 전시 구성 및 관람 동선은 현장 사정에 따라 달라질 수 있습니다.</p></div>`}
if(state.screen==='place')html=`${navHeader('journey',3)}<div class="center" style="padding-top:20px"><div class="chapter">오늘의 장소 · 임시 체험</div><h2 class="title" style="font-size:32px">${p.name}</h2><div class="small">${p.tag}</div></div><div class="location-art">${landscape}</div><div class="paper"><div class="name">오래된 유람첩에서</div><p>“${p.line}”</p></div><div class="mission"><strong>오늘의 미션 · 임시 체험</strong><br>${p.hint}<br><span style="font-size:12px;color:#8b7963">※ 실제 팀 미션이 확정되면 이 부분을 교체합니다.</span></div><div class="spacer"></div><div class="footer">${btn('미션 완료하고 도장 받기',"completeMission()")}</div>`;
if(state.screen==='memory')html=`${navHeader('journey',3)}<div class="spacer"></div><div class="center"><div class="chapter">기억 도장 획득</div><h2 class="title" style="font-size:29px">${p.name}의 기억</h2><div class="stamp"><div><strong>${p.symbol}</strong><br>${p.name}</div></div><p class="subtitle">오늘 이곳에 머문 아씨의 발자취가<br>유람첩에 남았습니다.</p></div><div class="divider"></div><div class="paper"><div class="name">아씨의 한 줄 기록 · 선택 사항</div><p style="font-size:13px;color:var(--sub)">오늘 가장 마음에 남은 순간을 적어 보세요.</p><input id="note" class="note" maxlength="100" placeholder="나만의 기억을 적어 주세요" value="${esc(state.notes[p.id]||'')}"></div><div class="spacer"></div><div class="footer">${btn('유람첩에 기록하기',"saveNote()")}</div>`;
if(state.screen==='ending'){let selected=PLACES.filter(x=>state.done.includes(x.id));html=`${navHeader('journey',4)}<div class="center" style="padding:20px 0 8px"><div class="chapter">마지막 장 · 다시 만난 계절</div><h2 class="title" style="font-size:30px">마지막 페이지</h2></div><div class="paper fade"><div class="center ornament">❧</div><p class="endtext">오래전 한 여인이<br>이 땅을 거닐었습니다.<br><br>그 여인의 유람첩은<br>오랫동안 마지막 장이 비어 있었지요.<br><br>그런데 오늘,<br><em>아씨의 발자취가 그 빈자리를 채웠습니다.</em></p><div class="divider"></div><p class="endtext" style="font-size:15px">“참 오래 기다렸습니다, 아씨.<br>어쩌면 아씨께서는<br>이 길을 처음 걷는 것이<br>아닐지도 모르겠네요.”</p><div class="center"><div class="small">— 유람첩의 안내자</div></div></div><div class="center" style="padding-top:22px"><div class="small">오늘의 여주 · 나의 기억</div><div class="stamps">${selected.map(x=>`<div class="stamp"><div><strong>${x.symbol}</strong><br>${x.name}</div></div>`).join('')}</div>${selected.map(x=>`<p style="font-size:13px;line-height:1.8"><b>${x.name}</b> · ${esc(state.notes[x.id]||'오늘의 풍경을 마음에 담았습니다.')}</p>`).join('')}</div><div class="spacer"></div><div class="footer">${btn('처음으로 돌아가기',"resetTour()",'secondary')}<p class="footnote">기억은 돌아오지 않아도, 새로운 이야기는 남습니다.</p></div>`}
app.innerHTML=html}
function openPlace(id){if(!PLACES.some(p=>p.id===id))return;state.selected=[...new Set([...state.selected,id])];go('story',{active:id,storyPage:0})};function advanceStory(){const story=STORIES[state.active];if(!story)return go('journey');if(state.storyPage<story.pages.length-1){state.storyPage++;save();render()}else go('guide',{guidePage:0})};function previousStory(){state.storyPage=Math.max(0,(state.storyPage||0)-1);save();render()};function advanceGuide(){const guide=GUIDES[state.active];if(!guide)return go('journey');if((state.guidePage||0)<guide.pages.length-1){state.guidePage++;save();render()}else go('place')};function previousGuide(){state.guidePage=Math.max(0,(state.guidePage||0)-1);save();render()};function finishTour(){if(!state.done.length)return alert('한 곳 이상 유람한 뒤 마지막 페이지를 펼칠 수 있습니다.');go('ending')};function advanceIntro(){if(state.dialogue<3){state.dialogue++;save();render()}else go('select')};function togglePlace(id){if(state.done.length)return alert('진행 중인 유람은 장소를 변경할 수 없습니다.');state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];save();render()};function completeMission(){if(!state.done.includes(state.active))state.done.push(state.active);if(!state.selected.includes(state.active))state.selected.push(state.active);go('memory')};function saveNote(){state.notes[state.active]=document.getElementById('note').value.trim();go('journey')};function resetTour(){if(!confirm('유람을 처음부터 다시 시작할까요? 기존 기록이 초기화됩니다.'))return;state={screen:'home',dialogue:0,storyPage:0,guidePage:0,selected:[],done:[],notes:{},active:null};save();render()};try{render()}catch(error){console.error(error);app.innerHTML=`<div style="margin:auto;text-align:center;padding:40px"><h1>아씨의 여주 유람</h1><p>화면을 불러오는 중 오류가 발생했습니다.</p><button onclick="localStorage.removeItem('yeoju-tour-v1');location.reload()" style="padding:14px;background:#426c61;color:white;border:0">처음부터 다시 시작</button></div>`}
</script></body></html>
